<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audiobook maker</title>
<meta name="description" content="Turn a PDF into a chaptered audiobook on your own Mac, one chapter at a time.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar">
  <h1>Audiobook maker</h1>
  <div class="status" id="status" aria-live="polite">Loading</div>
</header>

<div class="shell">
  <aside class="rail">
    <label class="drop" id="drop">
      <strong>Add a PDF</strong>
      <small>Drop it here or click to choose</small>
      <input type="file" id="file" accept="application/pdf" class="visually-hidden">
    </label>

    <section>
      <h2>Books</h2>
      <ul class="books" id="books"></ul>
    </section>

    <section class="rail" aria-label="Voice settings">
      <h2>Voice</h2>
      <label class="field">Narrator
        <select id="voice"><option value="">Default voice</option></select>
      </label>
      <label class="field">Add a narrator (10 to 20 second .wav)
        <input type="file" id="voicefile" accept="audio/wav,.wav">
      </label>
      <label class="field">Expressiveness <output id="emoOut">0.60</output>
        <input type="range" id="emotion" min="0.4" max="0.9" step="0.05" value="0.6">
      </label>
      <p class="hint">0.5 is neutral. Higher reads with more feeling.</p>
    </section>
  </aside>

  <main class="main" id="main"></main>
</div>

<footer class="player">
  <div class="now" id="now">Nothing playing<small>Play a finished chapter</small></div>
  <audio id="audio" controls preload="none"></audio>
</footer>

<script src="app.js"></script>
</body>
</html>
